# Weekly grate app test CI for lind-wasm-apps
#
# Run by a trigger that Cloud Scheduler fires once every two weeks.
# Builds the apps on the latest lind-wasm release image, builds the grates
# from lind-wasm-example-grates, runs the app tests under each grate,
# publishes the results as a GitHub pre-release, and posts to Slack.
#
# Steps:
#   1. Resolve Commit  - find the lind-wasm-apps commit being built
#   2. Fetch Grates    - clone lind-wasm-example-grates into /workspace/grates
#   3. Build And Test  - run the Dockerfile up to the artifacts-grates stage, save results to /workspace/out
#   4. Write Release   - pick the release tag and write the release body from the results
#   5. Publish Release - create or update a date-tagged pre-release, attach the results, notify Slack
#   6. Evaluate        - fail the build only if docker build failed; test results do not decide it
#
# /workspace is shared by all steps.
# Write Release is a separate step because Cloud Build limits one step argument
# to 10000 characters, and Publish Release with the body script exceeds it.

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_32
  diskSizeGb: 200
  substitution_option: ALLOW_LOOSE

substitutions:
  _GITHUB_REPO: "Lind-Project/lind-wasm-apps"
  # Override to run against another runtime image.
  _BASE_IMAGE: "securesystemslab/lind-wasm:latest"
  # Grates source.
  _GRATES_REPO: "Lind-Project/lind-wasm-example-grates"
  _GRATES_REF: "main"
  # Apps and grates to test.
  # Empty values keep the defaults in the Dockerfile.
  _GRATE_TEST_APPS: ""
  _TEST_GRATES: ""

availableSecrets:
  secretManager:
    - versionName: projects/x-micron-451502-m7/secrets/github-token-apps-ci/versions/latest
      env: GITHUB_TOKEN
    - versionName: projects/x-micron-451502-m7/secrets/slack-webhook-grates-ci/versions/latest
      env: SLACK_WEBHOOK

# A full app build takes about 1.5 hour. 
# The docker build itself is stopped at 5 hours (Build And Test), so the later
# steps still have time to report it. If this timeout is hit instead, no step
# runs and Slack gets nothing.
timeout: 21600s

steps:
  - name: "gcr.io/cloud-builders/gcloud"
    id: Resolve Commit
    entrypoint: bash
    secretEnv: ["GITHUB_TOKEN"]
    env:
      - "BRANCH_NAME=$BRANCH_NAME"
      - "COMMIT_SHA=$COMMIT_SHA"
      - "GITHUB_REPO=${_GITHUB_REPO}"
    args:
      - -c
      - |
        set -uo pipefail

        # COMMIT_SHA is set when the trigger runs on a branch.
        # If it is empty, use the checked-out source, then the branch head.
        commit="$${COMMIT_SHA:-}"
        if [[ -z "$${commit}" ]] && command -v git > /dev/null; then
          commit="$$(git -C /workspace rev-parse HEAD 2>/dev/null)"
        fi
        if [[ -z "$${commit}" && -n "$${BRANCH_NAME:-}" ]]; then
          auth=()
          [[ -n "$${GITHUB_TOKEN:-}" ]] && auth=(-H "Authorization: Bearer $${GITHUB_TOKEN}")
          commit="$$(curl -sS "$${auth[@]}" \
            "https://api.github.com/repos/$${GITHUB_REPO}/commits/$${BRANCH_NAME}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("sha",""))' \
            2>/dev/null)"
        fi

        # An empty file is fine here: the build records "unknown",
        # and Publish Release skips the release.
        echo -n "$${commit}" > /workspace/apps_commit
        echo "branch=$${BRANCH_NAME:-<none>} commit=$${commit:-<unknown>}"

  - name: "gcr.io/cloud-builders/git"
    id: Fetch Grates
    entrypoint: bash
    env:
      - "GRATES_REPO=${_GRATES_REPO}"
      - "GRATES_REF=${_GRATES_REF}"
    args:
      - -c
      - |
        # No -e: a failed clone is recorded (empty grates_commit, no grates/),
        # and Build And Test reports it instead of building.
        set -uo pipefail

        # The Dockerfile copies ./grates into the image (build-grates stage).
        rm -rf /workspace/grates
        if git clone --quiet "https://github.com/$${GRATES_REPO}.git" /workspace/grates \
           && git -C /workspace/grates checkout --quiet "$${GRATES_REF}"; then
          git -C /workspace/grates rev-parse HEAD | tr -d '\n' > /workspace/grates_commit
        else
          echo "Could not fetch $${GRATES_REPO} at $${GRATES_REF}."
          rm -rf /workspace/grates
          : > /workspace/grates_commit
        fi
        echo "grates: $${GRATES_REPO}@$${GRATES_REF} commit=$$(cat /workspace/grates_commit)"

  - name: "gcr.io/cloud-builders/docker"
    id: Build And Test
    entrypoint: bash
    env:
      - "BASE_IMAGE=${_BASE_IMAGE}"
      - "GRATE_TEST_APPS=${_GRATE_TEST_APPS}"
      - "TEST_GRATES=${_TEST_GRATES}"
    args:
      - -c
      - |
        # No -e: a failed build is recorded in build_status, and this step
        # exits 0 so that Publish Release can still report it.
        set -uo pipefail

        out=/workspace/out
        rm -rf "$${out}"
        commit="$$(cat /workspace/apps_commit)"
        grates_commit="$$(cat /workspace/grates_commit 2>/dev/null)"

        if [[ ! -d /workspace/grates ]]; then
          echo -n "nogrates" > /workspace/build_status
          echo "grates source is missing. Skipping docker build."
          exit 0
        fi

        # Pass the test lists only when set, so the Dockerfile defaults apply otherwise.
        extra=()
        [[ -n "$${GRATE_TEST_APPS:-}" ]] && extra+=(--build-arg GRATE_TEST_APPS="$${GRATE_TEST_APPS}")
        [[ -n "$${TEST_GRATES:-}" ]]     && extra+=(--build-arg TEST_GRATES="$${TEST_GRATES}")

        # --output type=local needs the docker-container driver.
        docker buildx create --use --name cbuilder --driver docker-container \
          || docker buildx use cbuilder
        docker buildx inspect --bootstrap

        # Record which runtime image this run used. The tag "latest" moves
        # every time lind-wasm main changes, so the digest is the real record.
        # Read the first "Digest:" line: the digest of the tag (image index).
        # (--format is not applied by the buildx in this builder image.)
        digest="$$(docker buildx imagetools inspect "$${BASE_IMAGE}" 2>/dev/null \
          | awk '/^Digest:/ {print $$2; exit}')"
        echo -n "$${BASE_IMAGE}@$${digest:-<unknown>}" > /workspace/base_image
        echo "base image: $$(cat /workspace/base_image)"

        # Exits non-zero only if the image build fails (e.g. merge-sysroot).
        # App build, grate build and test failures are recorded in the results instead.
        timeout 5h docker buildx build \
          --platform=linux/amd64 \
          --progress=plain \
          --pull \
          --target artifacts-grates \
          --build-arg BASE_IMAGE="$${BASE_IMAGE}" \
          --build-arg APPS_COMMIT="$${commit:-unknown}" \
          --build-arg GRATES_COMMIT="$${grates_commit:-unknown}" \
          "$${extra[@]}" \
          --output type=local,dest="$${out}" \
          .
        rc=$$?

        # 124 means `timeout` stopped it.
        echo -n "$${rc}" > /workspace/build_status
        echo "docker build exit: $${rc}"

        # Stop BuildKit so it does not keep using CPU after a timeout.
        docker buildx rm cbuilder > /dev/null 2>&1 || true
        exit 0

  - name: "gcr.io/cloud-builders/gcloud"
    id: Write Release
    entrypoint: bash
    env:
      - "BRANCH_NAME=$BRANCH_NAME"
      - "GITHUB_REPO=${_GITHUB_REPO}"
      - "GRATES_REPO=${_GRATES_REPO}"
    args:
      - -c
      - |
        # No -e: a missing body is reported by Publish Release.
        set -uo pipefail

        out=/workspace/out
        # Picked once here, so both steps use the same tag even across midnight UTC.
        # Prefixed so it does not collide with the apps weekly tag (YYYY-MM-DD).
        tag="grates-$$(date -u +%Y-%m-%d)"
        echo -n "$${tag}" > /workspace/release_tag
        rm -f /workspace/release-body.md

        if [[ ! -f "$${out}/grate-test-results.tsv" ]]; then
          echo "No grate test results. The release body was not written."
          exit 0
        fi

        branch="$${BRANCH_NAME:-}"
        commit="$$(cat /workspace/apps_commit 2>/dev/null)"
        grates_commit="$$(cat /workspace/grates_commit 2>/dev/null)"
        asset=grate-results.tar.gz
        asset_url="https://github.com/$${GITHUB_REPO}/releases/download/$${tag}/$${asset}"

        # Body: app x grate results, build failures, and what was run.
        python3 - "$${out}" "$${branch}" "$${commit}" "$${GRATES_REPO}" "$${grates_commit}" \
          "$$(cat /workspace/base_image)" "$${asset}" "$${asset_url}" \
          > /workspace/release-body.md <<'PY'
        import re, sys
        out, branch, commit, grates_repo, grates_commit, base_image, asset, asset_url = sys.argv[1:9]

        def rows(path):
            try:
                with open(path) as f:
                    lines = f.read().splitlines()[1:]
            except OSError:
                return []
            return [l.split("\t") for l in lines if l.strip()]

        # Each app's test script prints its own summary line. Turn the known
        # formats into "passed/total". None means no summary line was found.
        ansi = re.compile(r"\x1b\[[0-9;]*m")
        patterns = [
            (re.compile(r"FAILED\D*(\d+)/(\d+) tests failed"),            # bash awk make perl (failures)
             lambda m: (int(m[2]) - int(m[1]), int(m[2]))),
            (re.compile(r"PASS: (\d+) \| FAIL: \d+ \| SKIPPED: \d+ \| TOTAL: (\d+)"),  # coreutils
             lambda m: (int(m[1]), int(m[2]))),
            (re.compile(r"Results: (\d+) total, (\d+) passed"),           # grep
             lambda m: (int(m[2]), int(m[1]))),
            (re.compile(r"(\d+)/(\d+) tests passed"),                     # awk make perl nginx lmbench
             lambda m: (int(m[1]), int(m[2]))),
        ]

        def test_result(app, grate):
            try:
                with open(f"{out}/logs/grate-test-{app}-{grate}.log", errors="replace") as f:
                    lines = [ansi.sub("", l).strip() for l in f]
            except OSError:
                return "no log"
            for line in reversed(lines):
                for pat, conv in patterns:
                    m = pat.search(line)
                    if m:
                        passed, total = conv(m)
                        return f"{passed}/{total}"
            return None

        apps, grates, cells = [], [], {}
        for app, grate, rc, *_ in rows(f"{out}/grate-test-results.tsv"):
            if app not in apps:
                apps.append(app)
            if grate not in grates:
                grates.append(grate)
            if rc == "skipped":
                cell = "-"
            elif rc == "124":
                cell = "timeout"
            else:
                # No summary line: the run stopped before the tests were counted.
                cell = test_result(app, grate) or ("FAILED" if rc != "0" else "no summary")
            cells[(app, grate)] = cell

        print("## Grate test results")
        print("Each cell is passed/total.")
        print("`FAILED` means the run ended without a result summary, so no tests were counted")
        print("(for example, the app or the grate stopped at startup). See the logs in the asset.")
        print("`-` means the app was not built or installed.")
        print()
        print("| app | " + " | ".join(grates) + " |")
        print("|---|" + "---|" * len(grates))
        for app in apps:
            print(f"| {app} | " + " | ".join(cells.get((app, g), "") for g in grates) + " |")
        print()

        # Only targets that ran and failed.
        failed_grates = [(t, rc) for t, rc, *_ in rows(f"{out}/grates-build.tsv") if rc != "0"]
        print("## Grate build failures")
        if failed_grates:
            print("| target | exit |")
            print("|---|---|")
            for t, rc in failed_grates:
                print(f"| {t} | {rc} |")
        else:
            print("None")
        print()

        # "skipped" installs follow from a failed build, so they are not listed again.
        failed_apps = [(t, rc) for t, rc, *_ in rows(f"{out}/results.tsv")
                       if rc not in ("0", "skipped")]
        print("## App build failures")
        if failed_apps:
            print("| target | exit |")
            print("|---|---|")
            for t, rc in failed_apps:
                print(f"| {t} | {rc} |")
        else:
            print("None")
        print()

        runtime = "unknown"
        with open(f"{out}/env.txt", errors="replace") as f:
            for line in f:
                if line.startswith("runtime:"):
                    runtime = line.split(":", 1)[1].strip()
        print("## Run info")
        print(f"- apps commit: `{commit}` (branch `{branch}`)")
        print(f"- grates commit: `{grates_commit or 'unknown'}` ({grates_repo})")
        print(f"- base image: `{base_image}`")
        print(f"- runtime: {runtime}")
        print(f"- [{asset}]({asset_url}) - all results and logs")
        PY
        rc=$$?
        if [[ "$${rc}" -ne 0 ]]; then
          echo "Writing the release body failed (exit $${rc})."
          rm -f /workspace/release-body.md
          exit 0
        fi
        echo "Release body written for $${tag}:"
        cat /workspace/release-body.md

  - name: "gcr.io/cloud-builders/gcloud"
    id: Publish Release
    entrypoint: bash
    secretEnv: ["GITHUB_TOKEN", "SLACK_WEBHOOK"]
    env:
      - "BRANCH_NAME=$BRANCH_NAME"
      - "GITHUB_REPO=${_GITHUB_REPO}"
      - "GRATES_REPO=${_GRATES_REPO}"
    args:
      - -c
      - |
        # No -e: this step reports problems and exits 0. Publishing is a
        # recording concern, not a test result.
        set -uo pipefail

        out=/workspace/out
        api=https://api.github.com
        # Asset uploads use a different host than the rest of the REST API.
        uploads=https://uploads.github.com

        # Picked by the Write Release step.
        tag="$$(cat /workspace/release_tag 2>/dev/null)"
        [[ -n "$${tag}" ]] || tag="grates-$$(date -u +%Y-%m-%d)"
        release_url="https://github.com/$${GITHUB_REPO}/releases/tag/$${tag}"

        # Post one message to Slack. Never fails the step and never prints the
        # webhook URL: anyone with that URL can post to the channel.
        notify_slack() {
          if [[ -z "$${SLACK_WEBHOOK:-}" ]]; then
            echo "Slack notification skipped: SLACK_WEBHOOK is empty."
            return 0
          fi
          local payload
          payload="$$(python3 -c 'import json,sys; print(json.dumps({"text": sys.argv[1]}))' "$$1")"
          curl -sS -o /dev/null -w 'slack: HTTP %{http_code}\n' \
            -X POST -H 'Content-Type: application/json' \
            -d "$${payload}" "$${SLACK_WEBHOOK}" \
            || echo "slack: request failed."
        }

        # Every early exit goes through here, so the reason is in the log and
        # in Slack. A week with no release must not look like a quiet week.
        skip() {
          echo "Publish skipped: $$1"
          notify_slack "$$(printf '%s\n%s\n%s' \
            "Weekly grate app test completed - $${tag}" \
            "$${GITHUB_REPO}" \
            "Release was not published: $$1")"
          exit 0
        }

        rc="$$(cat /workspace/build_status 2>/dev/null)"
        case "$${rc}" in
          0)        ;;
          nogrates) skip "could not fetch $${GRATES_REPO}. See the Fetch Grates step." ;;
          124)      skip "docker build timed out after 5 hours." ;;
          "")       skip "docker build did not run." ;;
          *)        skip "docker build failed (exit $${rc}). See the Cloud Build log." ;;
        esac

        [[ -f "$${out}/grate-test-results.tsv" ]] || skip "no grate test results were produced."
        [[ -n "$${GITHUB_TOKEN:-}" ]] || skip "GITHUB_TOKEN is empty."

        # Refuse to guess. Tagging the wrong branch or commit is worse than not tagging.
        branch="$${BRANCH_NAME:-}"
        [[ -n "$${branch}" ]] || skip "BRANCH_NAME is empty, so the branch to tag is unknown."
        commit="$$(cat /workspace/apps_commit 2>/dev/null)"
        [[ -n "$${commit}" ]] || skip "could not resolve the commit of $${branch}."
        auth=(-H "Authorization: Bearer $${GITHUB_TOKEN}"
              -H "Accept: application/vnd.github+json"
              -H "X-GitHub-Api-Version: 2022-11-28")

        # Written by the Write Release step.
        [[ -s /workspace/release-body.md ]] || skip "the release body was not written. See the Write Release step."

        # All results (tsv files, env.txt, every log) in one file.
        asset=grate-results.tar.gz
        tar -C "$${out}" -czf "/workspace/$${asset}" .

        # Build the JSON in python so the body text is escaped correctly.
        python3 - "$${tag}" "$${commit}" /workspace/release-body.md \
          > /workspace/release-payload.json <<'PY'
        import json, sys
        tag, commit, body_path = sys.argv[1], sys.argv[2], sys.argv[3]
        with open(body_path) as f:
            body = f.read()
        print(json.dumps({
            "tag_name": tag,
            "target_commitish": commit,
            "name": "Weekly grate app test " + tag.removeprefix("grates-"),
            "body": body,
            "prerelease": True,
            "make_latest": "false",
        }))
        PY

        # A same-day rerun updates the existing release instead of failing on
        # a duplicate tag.
        release_id="$$(curl -sS "$${auth[@]}" \
          "$${api}/repos/$${GITHUB_REPO}/releases/tags/$${tag}" \
          | python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))' \
          2>/dev/null)"

        if [[ -n "$${release_id}" ]]; then
          echo "Release for $${tag} exists (id=$${release_id}). Updating it."
          # The tag still points at the earlier commit, so move it.
          curl -sS -o /dev/null -w 'move tag: HTTP %{http_code}\n' \
            -X PATCH "$${auth[@]}" \
            "$${api}/repos/$${GITHUB_REPO}/git/refs/tags/$${tag}" \
            -d "{\"sha\":\"$${commit}\",\"force\":true}"
          code="$$(curl -sS -o /workspace/release-response.json -w '%{http_code}' \
            -X PATCH "$${auth[@]}" \
            "$${api}/repos/$${GITHUB_REPO}/releases/$${release_id}" \
            -d @/workspace/release-payload.json)"
        else
          echo "Creating release $${tag}."
          code="$$(curl -sS -o /workspace/release-response.json -w '%{http_code}' \
            -X POST "$${auth[@]}" \
            "$${api}/repos/$${GITHUB_REPO}/releases" \
            -d @/workspace/release-payload.json)"
        fi

        if [[ "$${code}" != 2* ]]; then
          head -c 2000 /workspace/release-response.json || true
          echo
          skip "GitHub returned HTTP $${code}."
        fi

        echo "Published: $$(python3 -c 'import sys,json; print(json.load(sys.stdin).get("html_url",""))' \
          < /workspace/release-response.json 2>/dev/null)"

        # The create path has no release id yet; read it from the response.
        if [[ -z "$${release_id}" ]]; then
          release_id="$$(python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))' \
            < /workspace/release-response.json 2>/dev/null)"
        fi

        # Attach one file. An asset with the same name (same-day rerun) is
        # removed first. Failures are logged only: the release already exists.
        upload_asset() {
          local src="$$1" name="$$2" type="$$3"
          if [[ ! -f "$${src}" ]]; then
            echo "asset $${name}: $${src} not found, skipping."
            return 0
          fi
          local old_id
          old_id="$$(curl -sS "$${auth[@]}" \
            "$${api}/repos/$${GITHUB_REPO}/releases/$${release_id}/assets?per_page=100" \
            | python3 -c 'import sys,json; n=sys.argv[1]; print(next((str(a["id"]) for a in json.load(sys.stdin) if a.get("name")==n),""))' \
              "$${name}" 2>/dev/null)"
          if [[ -n "$${old_id}" ]]; then
            curl -sS -o /dev/null -w "asset $${name}: delete old HTTP %{http_code}\n" \
              -X DELETE "$${auth[@]}" \
              "$${api}/repos/$${GITHUB_REPO}/releases/assets/$${old_id}"
          fi
          local up_code
          up_code="$$(curl -sS -o /workspace/asset-response.json -w '%{http_code}' \
            -X POST "$${auth[@]}" \
            -H "Content-Type: $${type}" \
            --data-binary @"$${src}" \
            "$${uploads}/repos/$${GITHUB_REPO}/releases/$${release_id}/assets?name=$${name}")"
          if [[ "$${up_code}" == 2* ]]; then
            echo "asset $${name}: uploaded ($$(wc -c < "$${src}") bytes)."
          else
            echo "asset $${name}: upload failed with HTTP $${up_code}."
            head -c 500 /workspace/asset-response.json || true
            echo
          fi
        }

        if [[ -n "$${release_id}" ]]; then
          upload_asset "/workspace/$${asset}" "$${asset}" "application/gzip"
        else
          echo "release id could not be resolved, so no assets were attached."
        fi

        # No test results in Slack. The release page has them.
        notify_slack "$$(printf '%s\n%s\n%s' \
          "Weekly grate app test completed - $${tag}" \
          "$${GITHUB_REPO}" \
          "Results: $${release_url}")"

  - name: "gcr.io/cloud-builders/gcloud"
    id: Evaluate
    entrypoint: bash
    args:
      - -c
      - |
        set -uo pipefail

        out=/workspace/out

        echo "base image: $$(cat /workspace/base_image 2>/dev/null)"
        echo "apps commit: $$(cat /workspace/apps_commit 2>/dev/null)"
        echo "grates commit: $$(cat /workspace/grates_commit 2>/dev/null)"

        # Fail only when the pipeline itself broke. Failed builds or tests
        # are expected and are the data this pipeline records.
        rc="$$(cat /workspace/build_status 2>/dev/null)"
        if [[ "$${rc}" != "0" ]]; then
          echo "docker build failed or did not run (status $${rc:-<none>})."
          exit 1
        fi
        if [[ ! -f "$${out}/grate-test-results.tsv" ]]; then
          echo "grate-test-results.tsv was not produced. Check the test-grates and artifacts-grates stages."
          exit 1
        fi

        echo "===== app build/install results ====="
        cat "$${out}/results.tsv"
        echo "===== grate build results ====="
        cat "$${out}/grates-build.tsv"
        echo "===== grate test results ====="
        cat "$${out}/grate-test-results.tsv"
        echo "========================"
        echo "Pipeline finished. Test failures do not fail this build."

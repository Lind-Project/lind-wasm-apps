# Weekly CI for lind-wasm-apps
#
# Run by a trigger that Cloud Scheduler fires every Friday at 08:00 America/New_York.
# Builds and tests the apps on the latest lind-wasm release image, publishes
# the results as a GitHub pre-release, and posts to Slack.
#
# Steps:
#   1. Resolve Commit  - find the commit being built
#   2. Build And Test  - run the Dockerfile up to the artifacts stage, save results to /workspace/out
#   3. Publish Release - create or update a date-tagged pre-release, attach the results, notify Slack
#   4. Evaluate        - fail the build only if docker build failed; test results do not decide it
#
# /workspace is shared by all steps.

options:
  logging: CLOUD_LOGGING_ONLY
  # Same as the grates pipeline. Review after the first runs (time, memory).
  machineType: E2_HIGHCPU_8
  # TODO: set from the first run. The first 100 GB is free.
  diskSizeGb: 200
  substitution_option: ALLOW_LOOSE

substitutions:
  _GITHUB_REPO: "Lind-Project/lind-wasm-apps"
  # Override to run against another runtime image.
  _BASE_IMAGE: "securesystemslab/lind-wasm:latest"

availableSecrets:
  secretManager:
    - versionName: projects/x-micron-451502-m7/secrets/github-token-apps-ci/versions/latest
      env: GITHUB_TOKEN
    - versionName: projects/x-micron-451502-m7/secrets/slack-webhook-grates-ci/versions/latest
      env: SLACK_WEBHOOK

# A full build takes about 2.5 hours on 8 cores. The docker build itself is
# stopped at 5 hours (Build And Test), so the later steps still have time to
# report it. If this timeout is hit instead, no step runs and Slack gets nothing.
timeout: 21600s

steps:
  - name: "gcr.io/cloud-builders/gcloud"
    id: Resolve Commit
    entrypoint: bash
    secretEnv: ["GITHUB_TOKEN"]
    env:
      - "BRANCH_NAME=$BRANCH_NAME"
      - "COMMIT_SHA=$COMMIT_SHA"
      - "GITHUB_REPO=${_GITHUB_REPO}"
    args:
      - -c
      - |
        set -uo pipefail

        # COMMIT_SHA is empty when a trigger is run by Cloud Scheduler.
        # Then use the checked-out source, and the branch head as a last resort.
        commit="$${COMMIT_SHA:-}"
        if [[ -z "$${commit}" ]] && command -v git > /dev/null; then
          commit="$$(git -C /workspace rev-parse HEAD 2>/dev/null)"
        fi
        if [[ -z "$${commit}" && -n "$${BRANCH_NAME:-}" ]]; then
          auth=()
          [[ -n "$${GITHUB_TOKEN:-}" ]] && auth=(-H "Authorization: Bearer $${GITHUB_TOKEN}")
          commit="$$(curl -sS "$${auth[@]}" \
            "https://api.github.com/repos/$${GITHUB_REPO}/commits/$${BRANCH_NAME}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("sha",""))' \
            2>/dev/null)"
        fi

        # An empty file is fine here: the build records "unknown",
        # and Publish Release skips the release.
        echo -n "$${commit}" > /workspace/apps_commit
        echo "branch=$${BRANCH_NAME:-<none>} commit=$${commit:-<unknown>}"

  - name: "gcr.io/cloud-builders/docker"
    id: Build And Test
    entrypoint: bash
    env:
      - "BASE_IMAGE=${_BASE_IMAGE}"
    args:
      - -c
      - |
        # No -e: a failed build is recorded in build_status, and this step
        # exits 0 so that Publish Release can still report it.
        set -uo pipefail

        out=/workspace/out
        rm -rf "$${out}"
        commit="$$(cat /workspace/apps_commit)"

        # --output type=local needs the docker-container driver.
        docker buildx create --use --name cbuilder --driver docker-container \
          || docker buildx use cbuilder
        docker buildx inspect --bootstrap

        # Record which runtime image this run used. The tag "latest" moves
        # every time lind-wasm main changes, so the digest is the real record.
        digest="$$(docker buildx imagetools inspect "$${BASE_IMAGE}" \
          --format '{{.Manifest.Digest}}' 2>/dev/null)"
        echo -n "$${BASE_IMAGE}@$${digest:-<unknown>}" > /workspace/base_image
        echo "base image: $$(cat /workspace/base_image)"

        # Exits non-zero only if the image build fails (e.g. merge-sysroot).
        # App build and test failures are recorded in the results instead.
        timeout 5h docker buildx build \
          --platform=linux/amd64 \
          --progress=plain \
          --pull \
          --target artifacts \
          --build-arg BASE_IMAGE="$${BASE_IMAGE}" \
          --build-arg APPS_COMMIT="$${commit:-unknown}" \
          --output type=local,dest="$${out}" \
          .
        rc=$$?

        # 124 means `timeout` stopped it.
        echo -n "$${rc}" > /workspace/build_status
        echo "docker build exit: $${rc}"

        # Stop BuildKit so it does not keep using CPU after a timeout.
        docker buildx rm cbuilder > /dev/null 2>&1 || true
        exit 0

  - name: "gcr.io/cloud-builders/gcloud"
    id: Publish Release
    entrypoint: bash
    secretEnv: ["GITHUB_TOKEN", "SLACK_WEBHOOK"]
    env:
      - "BRANCH_NAME=$BRANCH_NAME"
      - "GITHUB_REPO=${_GITHUB_REPO}"
    args:
      - -c
      - |
        # No -e: this step reports problems and exits 0. Publishing is a
        # recording concern, not a test result.
        set -uo pipefail

        out=/workspace/out
        api=https://api.github.com
        # Asset uploads use a different host than the rest of the REST API.
        uploads=https://uploads.github.com

        tag="$$(date -u +%Y-%m-%d)"
        release_url="https://github.com/$${GITHUB_REPO}/releases/tag/$${tag}"

        # Post one message to Slack. Never fails the step and never prints the
        # webhook URL: anyone with that URL can post to the channel.
        notify_slack() {
          if [[ -z "$${SLACK_WEBHOOK:-}" ]]; then
            echo "Slack notification skipped: SLACK_WEBHOOK is empty."
            return 0
          fi
          local payload
          payload="$$(python3 -c 'import json,sys; print(json.dumps({"text": sys.argv[1]}))' "$$1")"
          curl -sS -o /dev/null -w 'slack: HTTP %{http_code}\n' \
            -X POST -H 'Content-Type: application/json' \
            -d "$${payload}" "$${SLACK_WEBHOOK}" \
            || echo "slack: request failed."
        }

        # Every early exit goes through here, so the reason is in the log and
        # in Slack. A week with no release must not look like a quiet week.
        skip() {
          echo "Publish skipped: $$1"
          notify_slack "$$(printf '%s\n%s\n%s' \
            "Weekly apps test completed - $${tag}" \
            "$${GITHUB_REPO}" \
            "Release was not published: $$1")"
          exit 0
        }

        rc="$$(cat /workspace/build_status 2>/dev/null)"
        case "$${rc}" in
          0)   ;;
          124) skip "docker build timed out after 5 hours." ;;
          "")  skip "docker build did not run." ;;
          *)   skip "docker build failed (exit $${rc}). See the Cloud Build log." ;;
        esac

        [[ -f "$${out}/test-results.tsv" ]] || skip "no test results were produced."
        [[ -n "$${GITHUB_TOKEN:-}" ]] || skip "GITHUB_TOKEN is empty."

        # Refuse to guess. Tagging the wrong branch or commit is worse than not tagging.
        branch="$${BRANCH_NAME:-}"
        [[ -n "$${branch}" ]] || skip "BRANCH_NAME is empty, so the branch to tag is unknown."
        commit="$$(cat /workspace/apps_commit 2>/dev/null)"
        [[ -n "$${commit}" ]] || skip "could not resolve the commit of $${branch}."

        auth=(-H "Authorization: Bearer $${GITHUB_TOKEN}"
              -H "Accept: application/vnd.github+json"
              -H "X-GitHub-Api-Version: 2022-11-28")

        # All results (tsv files, env.txt, every log) in one file.
        asset=apps-results.tar.gz
        tar -C "$${out}" -czf "/workspace/$${asset}" .
        asset_url="https://github.com/$${GITHUB_REPO}/releases/download/$${tag}/$${asset}"

        # Body: test results, failed build/install targets, and what was built.
        {
          echo "Test results:"
          echo '```'
          cat "$${out}/test-results.tsv"
          echo '```'
          echo
          echo "Failed or skipped build/install targets:"
          echo '```'
          awk -F'\t' 'NR > 1 && $$2 != "0" {print $$1 "\t" $$2}' "$${out}/results.tsv"
          echo '```'
          echo
          echo "branch: \`$${branch}\`"
          echo "commit: \`$${commit}\`"
          echo "base image: \`$$(cat /workspace/base_image)\`"
          echo "$$(grep '^runtime:' "$${out}/env.txt")"
          echo
          echo "- [$${asset}]($${asset_url}) - all results and logs"
        } > /workspace/release-body.md

        # Build the JSON in python so the body text is escaped correctly.
        python3 - "$${tag}" "$${commit}" /workspace/release-body.md \
          > /workspace/release-payload.json <<'PY'
        import json, sys
        tag, commit, body_path = sys.argv[1], sys.argv[2], sys.argv[3]
        with open(body_path) as f:
            body = f.read()
        print(json.dumps({
            "tag_name": tag,
            "target_commitish": commit,
            "name": "Weekly apps test " + tag,
            "body": body,
            "prerelease": True,
            "make_latest": "false",
        }))
        PY

        # A same-day rerun updates the existing release instead of failing on
        # a duplicate tag.
        release_id="$$(curl -sS "$${auth[@]}" \
          "$${api}/repos/$${GITHUB_REPO}/releases/tags/$${tag}" \
          | python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))' \
          2>/dev/null)"

        if [[ -n "$${release_id}" ]]; then
          echo "Release for $${tag} exists (id=$${release_id}). Updating it."
          # The tag still points at the earlier commit, so move it.
          curl -sS -o /dev/null -w 'move tag: HTTP %{http_code}\n' \
            -X PATCH "$${auth[@]}" \
            "$${api}/repos/$${GITHUB_REPO}/git/refs/tags/$${tag}" \
            -d "{\"sha\":\"$${commit}\",\"force\":true}"
          code="$$(curl -sS -o /workspace/release-response.json -w '%{http_code}' \
            -X PATCH "$${auth[@]}" \
            "$${api}/repos/$${GITHUB_REPO}/releases/$${release_id}" \
            -d @/workspace/release-payload.json)"
        else
          echo "Creating release $${tag}."
          code="$$(curl -sS -o /workspace/release-response.json -w '%{http_code}' \
            -X POST "$${auth[@]}" \
            "$${api}/repos/$${GITHUB_REPO}/releases" \
            -d @/workspace/release-payload.json)"
        fi

        if [[ "$${code}" != 2* ]]; then
          head -c 2000 /workspace/release-response.json || true
          echo
          skip "GitHub returned HTTP $${code}."
        fi

        echo "Published: $$(python3 -c 'import sys,json; print(json.load(sys.stdin).get("html_url",""))' \
          < /workspace/release-response.json 2>/dev/null)"

        # The create path has no release id yet; read it from the response.
        if [[ -z "$${release_id}" ]]; then
          release_id="$$(python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))' \
            < /workspace/release-response.json 2>/dev/null)"
        fi

        # Attach one file. An asset with the same name (same-day rerun) is
        # removed first. Failures are logged only: the release already exists.
        upload_asset() {
          local src="$$1" name="$$2" type="$$3"
          if [[ ! -f "$${src}" ]]; then
            echo "asset $${name}: $${src} not found, skipping."
            return 0
          fi
          local old_id
          old_id="$$(curl -sS "$${auth[@]}" \
            "$${api}/repos/$${GITHUB_REPO}/releases/$${release_id}/assets?per_page=100" \
            | python3 -c 'import sys,json; n=sys.argv[1]; print(next((str(a["id"]) for a in json.load(sys.stdin) if a.get("name")==n),""))' \
              "$${name}" 2>/dev/null)"
          if [[ -n "$${old_id}" ]]; then
            curl -sS -o /dev/null -w "asset $${name}: delete old HTTP %{http_code}\n" \
              -X DELETE "$${auth[@]}" \
              "$${api}/repos/$${GITHUB_REPO}/releases/assets/$${old_id}"
          fi
          local up_code
          up_code="$$(curl -sS -o /workspace/asset-response.json -w '%{http_code}' \
            -X POST "$${auth[@]}" \
            -H "Content-Type: $${type}" \
            --data-binary @"$${src}" \
            "$${uploads}/repos/$${GITHUB_REPO}/releases/$${release_id}/assets?name=$${name}")"
          if [[ "$${up_code}" == 2* ]]; then
            echo "asset $${name}: uploaded ($$(wc -c < "$${src}") bytes)."
          else
            echo "asset $${name}: upload failed with HTTP $${up_code}."
            head -c 500 /workspace/asset-response.json || true
            echo
          fi
        }

        if [[ -n "$${release_id}" ]]; then
          upload_asset "/workspace/$${asset}" "$${asset}" "application/gzip"
        else
          echo "release id could not be resolved, so no assets were attached."
        fi

        # No test results in Slack. The release page has them.
        notify_slack "$$(printf '%s\n%s\n%s' \
          "Weekly apps test completed - $${tag}" \
          "$${GITHUB_REPO}" \
          "Results: $${release_url}")"

  - name: "gcr.io/cloud-builders/gcloud"
    id: Evaluate
    entrypoint: bash
    args:
      - -c
      - |
        set -uo pipefail

        out=/workspace/out

        echo "base image: $$(cat /workspace/base_image 2>/dev/null)"
        echo "commit: $$(cat /workspace/apps_commit 2>/dev/null)"

        # Fail only when the pipeline itself broke. Failed app builds or tests
        # are expected and are the data this pipeline records.
        rc="$$(cat /workspace/build_status 2>/dev/null)"
        if [[ "$${rc}" != "0" ]]; then
          echo "docker build failed (exit $${rc:-<none>})."
          exit 1
        fi
        if [[ ! -f "$${out}/test-results.tsv" ]]; then
          echo "test-results.tsv was not produced. Check the test and artifacts stages."
          exit 1
        fi

        echo "===== build/install results ====="
        cat "$${out}/results.tsv"
        echo "===== test results ====="
        cat "$${out}/test-results.tsv"
        echo "========================"
        echo "Pipeline finished. Test failures do not fail this build."
        
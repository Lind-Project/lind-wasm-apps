[package]
name = "in-toto-cli"
version = "0.1.0"
edition = "2021"
description = "Thin command-line driver over the in-toto crate for lind-wasm (keygen / run / gen-layout / verify)"
license = "MIT"

[dependencies]
in-toto = "0.4"
serde = "1"
serde_json = "1"
chrono = { version = "0.4", default-features = false }

[profile.release]
opt-level = 2
debug = 1
